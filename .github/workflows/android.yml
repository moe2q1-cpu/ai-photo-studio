
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract app files
        run: |
          mkdir app
          unzip -o "ai_photo_studio_flutter_starter(1).zip" -d app

      - name: Build APK
        run: |
          cd app
          flutter create . --platforms=android --project-name ai_photo_studio
          flutter pub get
          flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-photo-studio-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
